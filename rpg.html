<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7">
  <title>Daily RPG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #f2f2f7;
      --card:   #ffffff;
      --text:   #1c1c1e;
      --sub:    #3c3c43;
      --muted:  #8e8e93;
      --sep:    #e5e5ea;
      --accent: #007aff;
      --corps:  #ff3b30;
      --esprit: #34c759;
      --focus:  #5856d6;
      --sh: 0 1px 4px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button { touch-action: manipulation; font-family: inherit; }

    .app {
      max-width: 430px;
      margin: 0 auto;
      padding: 0 16px 88px;
    }

    /* ── RING ─────────────────────── */
    .ring-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 44px 0 24px;
      gap: 10px;
    }

    .ring-wrap {
      position: relative;
      width: 152px;
      height: 152px;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: var(--sep);
      stroke-width: 9;
    }

    .ring-fill {
      fill: none;
      stroke: var(--muted);
      stroke-width: 9;
      stroke-linecap: round;
      /* circumference = 2π × 62 ≈ 389.56 */
      stroke-dasharray: 389.56;
      stroke-dashoffset: 389.56;
      transition: stroke-dashoffset 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  stroke 0.6s ease;
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .ring-lv {
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .ring-stage {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.5s;
    }

    .xp-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Stage label colour matches ring */
    [data-stage="2"] .ring-stage { color: #007aff; }
    [data-stage="3"] .ring-stage { color: #ff9f0a; }
    [data-stage="4"] .ring-stage { color: #ff375f; }

    /* ── DATE ─────────────────────── */
    .day-row {
      margin-bottom: 16px;
    }

    .day-text {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: capitalize;
    }

    /* ── QUESTS ───────────────────── */
    .quests {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }

    .quest-card {
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--sh);
      overflow: hidden;
      border: 1.5px solid transparent;
      transition: border-color 0.3s;
    }

    .quest-card[data-quest="corps"]  { --qc: var(--corps); }
    .quest-card[data-quest="esprit"] { --qc: var(--esprit); }
    .quest-card[data-quest="focus"]  { --qc: var(--focus); }

    .quest-card.completed { border-color: var(--qc); }

    .quest-inner {
      display: flex;
      align-items: center;
      padding: 16px 16px 12px;
      gap: 14px;
    }

    .q-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--qc);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .q-info { flex: 1; min-width: 0; }

    .q-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .q-sub {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .q-action { flex-shrink: 0; }

    .q-bar-row { padding: 0 16px 13px; }

    .q-track {
      height: 3px;
      background: var(--sep);
      border-radius: 2px;
      overflow: hidden;
    }

    .q-fill {
      height: 100%;
      width: 0%;
      background: var(--qc);
      border-radius: 2px;
      transition: width 1s linear;
    }

    /* ── BUTTONS ──────────────────── */
    .btn-timer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 15px;
      min-height: 44px;
      min-width: 88px;
      background: var(--bg);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--qc);
      justify-content: center;
    }

    .btn-timer.running {
      background: color-mix(in srgb, var(--qc) 10%, white);
    }

    .btn-complete {
      padding: 9px 16px;
      min-height: 44px;
      background: var(--qc);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      animation: pop 1.2s ease-in-out infinite;
    }

    @keyframes pop {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.05); }
    }

    .badge-done {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 9px 12px;
      min-height: 44px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--qc);
    }

    /* ── STATS ────────────────────── */
    .stats-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      flex: 1;
      background: var(--card);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      box-shadow: var(--sh);
    }

    .stat-val {
      display: block;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-lbl {
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── RECAP BUTTON ─────────────── */
    .btn-recap {
      width: 100%;
      padding: 16px;
      background: var(--card);
      border: none;
      border-radius: 16px;
      box-shadow: var(--sh);
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    /* ── RECAP MODAL ──────────────── */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-bg.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 430px;
      background: var(--bg);
      border-radius: 22px 22px 0 0;
      padding: 12px 20px 52px;
      max-height: 88vh;
      overflow-y: auto;
      animation: sheet-up 0.26s cubic-bezier(0.32, 0.72, 0, 1);
    }

    @keyframes sheet-up {
      from { transform: translateY(28px); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--sep);
      border-radius: 2px;
      margin: 0 auto 22px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 20px;
    }

    .week-grid {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .day-sq {
      flex: 1;
      background: var(--card);
      border-radius: 12px;
      padding: 9px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .day-sq.active { background: #edf4ff; }
    .day-sq.today  { background: #e0edff; box-shadow: 0 0 0 1.5px var(--accent); }
    .day-sq.future { opacity: 0.3; }

    .day-lbl {
      font-size: 0.55rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .day-dots {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: center;
    }

    .d-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sep);
    }

    .d-dot.corps-done  { background: var(--corps); }
    .d-dot.esprit-done { background: var(--esprit); }
    .d-dot.focus-done  { background: var(--focus); }

    .recap-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .rs-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 13px;
    }

    .rs-val {
      display: block;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.03em;
      margin-bottom: 3px;
    }

    .rs-lbl {
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .recap-msg {
      margin-top: 20px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.55;
    }

    .btn-close {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      background: var(--card);
      border: none;
      border-radius: 14px;
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── LEVEL-UP ─────────────────── */
    #lu-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #lu-overlay.show {
      display: flex;
      animation: lu-bg 3.8s forwards;
    }

    @keyframes lu-bg {
      0%   { background: rgba(0,0,0,0); }
      18%  { background: rgba(0,0,0,0.72); }
      80%  { background: rgba(0,0,0,0.72); }
      100% { background: rgba(0,0,0,0); }
    }

    .lu-content {
      text-align: center;
      animation: lu-pop 3.8s forwards;
    }

    @keyframes lu-pop {
      0%   { opacity: 0; transform: scale(0.8); }
      18%  { opacity: 1; transform: scale(1.02); }
      25%  { transform: scale(1); }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .lu-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .lu-number {
      font-size: 6.5rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      letter-spacing: -0.06em;
      margin-bottom: 8px;
    }

    .lu-stage {
      font-size: 1rem;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.05em;
    }

    /* ── TOAST ────────────────────── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(72px);
      background: #1c1c1e;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 11px 20px;
      border-radius: 22px;
      white-space: nowrap;
      z-index: 300;
      box-shadow: 0 4px 18px rgba(0,0,0,0.22);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="app">

  <!-- RING PROGRESS -->
  <div class="ring-section" id="ring-section" data-stage="1">
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 140 140">
        <circle class="ring-track" cx="70" cy="70" r="62"/>
        <circle class="ring-fill"  cx="70" cy="70" r="62" id="xp-ring"/>
      </svg>
      <div class="ring-center">
        <span class="ring-lv"    id="ring-level">1</span>
        <span class="ring-stage" id="ring-stage">Apprenti</span>
      </div>
    </div>
    <div class="xp-sub" id="xp-label">0 / 150 XP</div>
  </div>

  <!-- DATE -->
  <div class="day-row">
    <span class="day-text" id="day-text">—</span>
  </div>

  <!-- QUESTS -->
  <div class="quests">

    <div class="quest-card" data-quest="corps" id="quest-corps">
      <div class="quest-inner">
        <div class="q-dot"></div>
        <div class="q-info">
          <div class="q-name">Sport</div>
          <div class="q-sub">Séance physique · 20 min</div>
        </div>
        <div class="q-action" id="action-corps"></div>
      </div>
      <div class="q-bar-row">
        <div class="q-track"><div class="q-fill" id="fill-corps"></div></div>
      </div>
    </div>

    <div class="quest-card" data-quest="esprit" id="quest-esprit">
      <div class="quest-inner">
        <div class="q-dot"></div>
        <div class="q-info">
          <div class="q-name">Lecture</div>
          <div class="q-sub">Apprentissage · 15 min</div>
        </div>
        <div class="q-action" id="action-esprit"></div>
      </div>
      <div class="q-bar-row">
        <div class="q-track"><div class="q-fill" id="fill-esprit"></div></div>
      </div>
    </div>

    <div class="quest-card" data-quest="focus" id="quest-focus">
      <div class="quest-inner">
        <div class="q-dot"></div>
        <div class="q-info">
          <div class="q-name">Deep work</div>
          <div class="q-sub">Concentration · 30 min</div>
        </div>
        <div class="q-action" id="action-focus"></div>
      </div>
      <div class="q-bar-row">
        <div class="q-track"><div class="q-fill" id="fill-focus"></div></div>
      </div>
    </div>

  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <span class="stat-val" id="stat-streak">0</span>
      <span class="stat-lbl">🔥 Série</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" id="stat-days">0</span>
      <span class="stat-lbl">📅 Jours</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" id="stat-xp">0</span>
      <span class="stat-lbl">⚡ XP</span>
    </div>
  </div>

  <!-- RECAP -->
  <button class="btn-recap" onclick="openRecap()">Récap de la semaine →</button>

</div>

<!-- RECAP MODAL -->
<div class="modal-bg" id="recap-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Cette semaine</div>
    <div id="recap-body"></div>
    <button class="btn-close" onclick="closeRecap()">Fermer</button>
  </div>
</div>

<!-- LEVEL-UP -->
<div id="lu-overlay">
  <div class="lu-content">
    <div class="lu-label">Niveau</div>
    <div class="lu-number" id="lu-number">2</div>
    <div class="lu-stage"  id="lu-stage"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
/* =============================================
   CONFIG
============================================= */
const QUESTS = {
  corps:  { id: 'corps',  name: 'Sport',     minTime: 20 * 60, xp: 50 },
  esprit: { id: 'esprit', name: 'Lecture',   minTime: 15 * 60, xp: 40 },
  focus:  { id: 'focus',  name: 'Deep work', minTime: 30 * 60, xp: 60 }
};

const LEVEL_XP = [
  0, 150, 350, 600, 1000, 1500, 2100, 2800, 3600, 4600,
  5800, 7200, 8800, 10600, 12800, 15300, 18100, 21200, 24600, 28400,
  32500, 37000, 42000, 47500, 53500, 60000, 67500, 76000, 85000, 95000
];

const STAGE_LABELS = ['Apprenti', 'Disciple', 'Maître', 'Légende'];
const STAGE_COLORS = ['#8e8e93', '#007aff', '#ff9f0a', '#ff375f'];
const RING_CIRC    = 2 * Math.PI * 62; // ≈ 389.56
const BONUS_ALL_XP = 30;

/* =============================================
   STATE
============================================= */
const DEFAULT_TIMERS = () => ({
  corps:  { running: false, elapsed: 0, startTs: null, completed: false },
  esprit: { running: false, elapsed: 0, startTs: null, completed: false },
  focus:  { running: false, elapsed: 0, startTs: null, completed: false }
});

let state;
const intervals = {};

function loadState() {
  try {
    const raw = localStorage.getItem('rpg_v1');
    if (raw) {
      const s = JSON.parse(raw);
      const today = getToday();
      if (s.lastDate && s.lastDate !== today) {
        const yesterday = shiftDate(-1);
        const hadActivity = (s.log[yesterday] || {}).any;
        if (!hadActivity && s.streak > 0) s.streak = 0;
        s.timers = DEFAULT_TIMERS();
      }
      s.lastDate = today;
      return s;
    }
  } catch (_) {}
  return { totalXP: 0, streak: 0, totalDays: 0, lastDate: getToday(),
           log: {}, timers: DEFAULT_TIMERS() };
}

function save() { localStorage.setItem('rpg_v1', JSON.stringify(state)); }

/* =============================================
   DATE UTILS
============================================= */
function getToday() { return new Date().toISOString().split('T')[0]; }

function shiftDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

function todayLog() {
  const t = getToday();
  if (!state.log[t]) state.log[t] = {
    corps: false, esprit: false, focus: false, any: false,
    bonusAwarded: false, xp: 0, firstCompleted: false,
    corpsTime: 0, espritTime: 0, focusTime: 0
  };
  return state.log[t];
}

function fmt(secs) {
  const m = Math.floor(secs / 60), s = secs % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function fmtDuration(secs) {
  const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
  return h > 0 ? `${h}h${String(m).padStart(2,'0')}` : `${m} min`;
}

/* =============================================
   LEVEL / XP
============================================= */
function getLevel(xp) {
  for (let i = LEVEL_XP.length - 1; i >= 0; i--)
    if (xp >= LEVEL_XP[i]) return i + 1;
  return 1;
}

function getLevelProgress(xp) {
  const lv   = getLevel(xp);
  const cur  = LEVEL_XP[lv - 1] || 0;
  const next = LEVEL_XP[lv] || LEVEL_XP[LEVEL_XP.length - 1] + 10000;
  const prog = xp - cur, total = next - cur;
  return { prog, total, pct: Math.min(100, prog / total * 100), lv };
}

function getStage(lv) {
  if (lv >= 30) return 4;
  if (lv >= 15) return 3;
  if (lv >= 5)  return 2;
  return 1;
}

/* =============================================
   TIMER ENGINE
============================================= */
function getElapsed(id) {
  const t = state.timers[id];
  if (!t.running || !t.startTs) return t.elapsed;
  return t.elapsed + Math.floor((Date.now() - t.startTs) / 1000);
}

function toggleTimer(id) {
  const t = state.timers[id];
  if (t.completed) return;
  if (t.running) {
    t.elapsed  = getElapsed(id);
    t.running  = false;
    t.startTs  = null;
    clearInterval(intervals[id]);
    delete intervals[id];
  } else {
    t.running = true;
    t.startTs = Date.now();
    intervals[id] = setInterval(() => renderQuestCard(id), 1000);
  }
  save();
  renderQuestCard(id);
}

function completeQuest(id) {
  const t = state.timers[id];
  if (t.completed) return;

  t.elapsed = getElapsed(id);
  t.running = false; t.startTs = null;
  clearInterval(intervals[id]); delete intervals[id];
  t.completed = true;

  const log = todayLog();
  log[id] = true; log.any = true; log[`${id}Time`] = t.elapsed;

  const prevLv = getLevel(state.totalXP);
  state.totalXP += QUESTS[id].xp;
  log.xp = (log.xp || 0) + QUESTS[id].xp;

  if (log.corps && log.esprit && log.focus && !log.bonusAwarded) {
    state.totalXP += BONUS_ALL_XP;
    log.xp += BONUS_ALL_XP;
    log.bonusAwarded = true;
    setTimeout(() => toast(`Bonus +${BONUS_ALL_XP} XP — Journée parfaite !`), 1400);
  }

  if (!log.firstCompleted) {
    log.firstCompleted = true;
    state.totalDays++;
    state.streak++;
  }

  save();
  const newLv = getLevel(state.totalXP);
  if (newLv > prevLv) setTimeout(() => showLevelUp(newLv, prevLv), 900);

  toast(`+${QUESTS[id].xp} XP — ${QUESTS[id].name} !`);
  renderAll();
}

/* =============================================
   RENDER
============================================= */
function renderQuestCard(id) {
  const t       = state.timers[id];
  const elapsed = getElapsed(id);
  const pct     = Math.min(100, elapsed / QUESTS[id].minTime * 100);
  const reached = elapsed >= QUESTS[id].minTime;

  const fill = document.getElementById(`fill-${id}`);
  if (fill) fill.style.width = `${pct}%`;

  const card = document.getElementById(`quest-${id}`);
  if (card) card.classList.toggle('completed', t.completed);

  const area = document.getElementById(`action-${id}`);
  if (!area) return;

  if (t.completed) {
    area.innerHTML = `<div class="badge-done">✓ ${fmt(t.elapsed)}</div>`;
  } else if (reached && t.running) {
    area.innerHTML = `<button class="btn-complete" onclick="completeQuest('${id}')">Terminer</button>`;
  } else {
    const icon = t.running ? '⏸' : '▶';
    area.innerHTML = `<button class="btn-timer ${t.running ? 'running' : ''}" onclick="toggleTimer('${id}')">${icon} ${fmt(elapsed)}</button>`;
  }
}

function renderHero() {
  const { pct, prog, total, lv } = getLevelProgress(state.totalXP);
  const stage = getStage(lv);

  const lvEl = document.getElementById('ring-level');
  if (lvEl) lvEl.textContent = lv;

  const stEl = document.getElementById('ring-stage');
  if (stEl) stEl.textContent = STAGE_LABELS[stage - 1];

  const ring = document.getElementById('xp-ring');
  if (ring) {
    ring.style.strokeDashoffset = RING_CIRC * (1 - pct / 100);
    ring.style.stroke = STAGE_COLORS[stage - 1];
  }

  const lbl = document.getElementById('xp-label');
  if (lbl) lbl.textContent = `${prog} / ${total} XP`;

  const section = document.getElementById('ring-section');
  if (section) section.dataset.stage = stage;
}

function renderStats() {
  const el = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  el('stat-streak', state.streak);
  el('stat-days',   state.totalDays);
  el('stat-xp',     state.totalXP);
}

function renderDate() {
  const el = document.getElementById('day-text');
  if (el) el.textContent = new Date().toLocaleDateString('fr-FR',
    { weekday: 'long', day: 'numeric', month: 'long' });
}

function renderAll() {
  renderHero();
  renderStats();
  Object.keys(QUESTS).forEach(id => renderQuestCard(id));
}

/* =============================================
   LEVEL-UP
============================================= */
function showLevelUp(newLv, prevLv) {
  const stage = getStage(newLv);
  const stageChanged = stage !== getStage(prevLv);
  document.getElementById('lu-number').textContent = newLv;
  document.getElementById('lu-stage').textContent  = stageChanged ? STAGE_LABELS[stage - 1] : '';
  const ov = document.getElementById('lu-overlay');
  ov.classList.remove('show'); void ov.offsetWidth;
  ov.classList.add('show'); ov.style.pointerEvents = 'all';
  setTimeout(() => { ov.classList.remove('show'); ov.style.pointerEvents = 'none'; }, 3900);
}

/* =============================================
   RECAP
============================================= */
function openRecap()  { buildRecap(); document.getElementById('recap-modal').classList.add('open'); }
function closeRecap() { document.getElementById('recap-modal').classList.remove('open'); }

function buildRecap() {
  const today     = getToday();
  const dow       = new Date().getDay();
  const mondayOff = dow === 0 ? -6 : 1 - dow;
  const LABELS    = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const days      = Array.from({length: 7}, (_, i) => shiftDate(mondayOff + i));

  let wXP = 0, wQ = 0, wCorps = 0, wEsprit = 0, wFocus = 0;

  const squares = days.map((d, i) => {
    const log = state.log[d] || {};
    const done = (log.corps?1:0) + (log.esprit?1:0) + (log.focus?1:0);
    wXP += log.xp || 0; wQ += done;
    wCorps  += log.corpsTime  || 0;
    wEsprit += log.espritTime || 0;
    wFocus  += log.focusTime  || 0;
    const cls = d === today ? 'today' : d > today ? 'future' : done > 0 ? 'active' : '';
    return `<div class="day-sq ${cls}">
      <span class="day-lbl">${LABELS[i]}</span>
      <div class="day-dots">
        <span class="d-dot ${log.corps  ? 'corps-done'  : ''}"></span>
        <span class="d-dot ${log.esprit ? 'esprit-done' : ''}"></span>
        <span class="d-dot ${log.focus  ? 'focus-done'  : ''}"></span>
      </div></div>`;
  }).join('');

  const msgs = [
    'La régularité bat l\'intensité.',
    'Chaque session compte.',
    'Discipline = liberté.',
    'Tu construis quelque chose de réel.',
    'Le corps et l\'esprit, ensemble.'
  ];

  document.getElementById('recap-body').innerHTML = `
    <div class="week-grid">${squares}</div>
    <div class="recap-stats">
      <div class="rs-card"><span class="rs-val">${wXP}</span><span class="rs-lbl">⚡ XP</span></div>
      <div class="rs-card"><span class="rs-val">${wQ}</span><span class="rs-lbl">Quêtes</span></div>
      <div class="rs-card"><span class="rs-val">${fmtDuration(wFocus)}</span><span class="rs-lbl">Deep work</span></div>
      <div class="rs-card"><span class="rs-val">${fmtDuration(wCorps)}</span><span class="rs-lbl">Sport</span></div>
      <div class="rs-card"><span class="rs-val">${fmtDuration(wEsprit)}</span><span class="rs-lbl">Lecture</span></div>
      <div class="rs-card"><span class="rs-val">${state.streak}</span><span class="rs-lbl">🔥 Série</span></div>
    </div>
    <div class="recap-msg">${msgs[Math.floor(Math.random() * msgs.length)]}</div>`;
}

/* =============================================
   TOAST
============================================= */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* =============================================
   INIT
============================================= */
function init() {
  state = loadState();
  Object.keys(QUESTS).forEach(id => {
    if (state.timers[id].running)
      intervals[id] = setInterval(() => renderQuestCard(id), 1000);
  });
  renderDate();
  renderAll();
}

document.getElementById('recap-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeRecap();
});

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

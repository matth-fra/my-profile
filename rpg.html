<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d12">
  <title>Daily RPG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d12;
      --surface:  #17171f;
      --surface2: #1f1f29;
      --border:   #2a2a36;
      --text:     #f0f0f8;
      --sub:      #9898a8;
      --muted:    #55555f;

      --biscottos: #ff453a;
      --lecture:   #34c759;
      --flow:      #bf5af2;

      --s1: #8e8e93;
      --s2: #007aff;
      --s3: #ff9f0a;
      --s4: #ff375f;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button { touch-action: manipulation; font-family: inherit; }

    .app {
      max-width: 430px;
      margin: 0 auto;
      padding: 0 16px 100px;
    }

    /* ── HERO ─────────────────────────────────── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 44px 0 28px;
    }

    .hero-day-badge {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .avatar-wrap {
      position: relative;
      width: 160px;
      height: 186px;
      margin-bottom: 14px;
    }

    .avatar-ring {
      position: absolute;
      top: -10px; left: -10px; right: -10px; bottom: -10px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      transition: border-color 0.7s, box-shadow 0.7s;
      pointer-events: none;
    }

    [data-stage="2"] .avatar-ring { border-color: var(--s2); box-shadow: 0 0 22px rgba(0,122,255,.18); }
    [data-stage="3"] .avatar-ring { border-color: var(--s3); box-shadow: 0 0 22px rgba(255,159,10,.18); }
    [data-stage="4"] .avatar-ring { border-color: var(--s4); box-shadow: 0 0 30px rgba(255,55,95,.28); }

    .avatar-svg { width: 160px; height: 186px; overflow: visible; }

    .av-stage { opacity: 0; transition: opacity 0.7s ease; }
    .av-stage.active { opacity: 1; }

    .hero-stage-name {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--s1);
      margin-bottom: 6px;
      transition: color 0.7s;
    }
    [data-stage="2"] .hero-stage-name { color: var(--s2); }
    [data-stage="3"] .hero-stage-name { color: var(--s3); }
    [data-stage="4"] .hero-stage-name { color: var(--s4); }

    .hero-level-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 12px;
    }
    .hero-lv {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.06em;
      line-height: 1;
    }
    .hero-lv-lbl {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .xp-bar-wrap { width: 190px; }
    .xp-track {
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .xp-fill {
      height: 100%;
      width: 0%;
      background: var(--s1);
      border-radius: 4px;
      transition: width 1.1s cubic-bezier(.25,.46,.45,.94), background .7s;
    }
    [data-stage="2"] .xp-fill { background: var(--s2); }
    [data-stage="3"] .xp-fill { background: var(--s3); }
    [data-stage="4"] .xp-fill { background: var(--s4); }

    .xp-lbl {
      font-size: 0.65rem;
      color: var(--muted);
      text-align: center;
    }

    /* ── DATE ─────────────────────────────────── */
    .date-row { margin-bottom: 22px; }
    .date-text {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--sub);
      text-transform: capitalize;
    }

    /* ── SECTION LABEL ────────────────────────── */
    .section-lbl {
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── QUEST CARDS ──────────────────────────── */
    .quests-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 26px;
    }

    .quest-card {
      background: var(--surface);
      border-radius: 20px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      transition: border-color .35s, box-shadow .35s;
    }

    .quest-card[data-q="biscottos"] { --qc: var(--biscottos); }
    .quest-card[data-q="lecture"]   { --qc: var(--lecture); }
    .quest-card[data-q="flow"]      { --qc: var(--flow); }

    .quest-card.done {
      border-color: var(--qc);
      box-shadow: 0 0 18px color-mix(in srgb, var(--qc) 16%, transparent);
    }

    .main-badge {
      display: block;
      font-size: 0.52rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--qc);
      padding: 11px 16px 0;
    }

    .quest-inner {
      display: flex;
      align-items: center;
      padding: 13px 16px 11px;
      gap: 12px;
    }
    .main-quest .quest-inner { padding-top: 9px; }

    .q-icon { font-size: 1.5rem; line-height: 1; flex-shrink: 0; }

    .q-info { flex: 1; min-width: 0; }
    .q-name {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .main-quest .q-name { font-size: 1.02rem; }

    .q-sub { font-size: 0.71rem; color: var(--sub); }
    .q-action { flex-shrink: 0; }

    .q-bar-row { padding: 0 16px 13px; }
    .q-track {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .q-fill {
      height: 100%;
      width: 0%;
      background: var(--qc);
      border-radius: 2px;
      transition: width 1s linear;
    }

    /* ── BUTTONS ──────────────────────────────── */
    .btn-timer {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 9px 13px;
      min-height: 42px;
      min-width: 84px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--qc);
      justify-content: center;
    }
    .btn-timer.running {
      background: color-mix(in srgb, var(--qc) 11%, transparent);
      border-color: color-mix(in srgb, var(--qc) 38%, transparent);
      animation: timer-pulse 2.2s ease-in-out infinite;
    }
    @keyframes timer-pulse {
      0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--qc) 28%, transparent); }
      50%      { box-shadow: 0 0 0 7px transparent; }
    }

    .btn-complete {
      padding: 9px 15px;
      min-height: 42px;
      background: var(--qc);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      animation: complete-pop 1.5s ease-in-out infinite;
    }
    @keyframes complete-pop {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.07); }
    }

    .badge-done {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 9px 11px;
      min-height: 42px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--qc);
    }

    /* ── STATS ────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 8px;
      text-align: center;
    }
    .stat-val {
      display: block;
      font-size: 1.85rem;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 5px;
    }
    .stat-lbl {
      font-size: 0.56rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    /* ── RECAP BUTTON ─────────────────────────── */
    .btn-recap {
      width: 100%;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--sub);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: border-color .2s;
    }
    .btn-recap:active { border-color: var(--muted); }

    /* ── RECAP MODAL ──────────────────────────── */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-bg.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 12px 20px 52px;
      max-height: 88vh;
      overflow-y: auto;
      animation: sheet-up .28s cubic-bezier(.32,.72,0,1);
    }
    @keyframes sheet-up {
      from { transform: translateY(28px); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 22px;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--text);
      text-align: center;
      margin-bottom: 5px;
      letter-spacing: -0.02em;
    }
    .modal-sub {
      font-size: 0.72rem;
      color: var(--sub);
      text-align: center;
      margin-bottom: 22px;
    }

    .week-grid {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }
    .day-sq {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }
    .day-sq.active { background: #1a2030; border-color: #273048; }
    .day-sq.today  { background: #162038; box-shadow: 0 0 0 1.5px var(--s2); border-color: var(--s2); }
    .day-sq.future { opacity: 0.22; }

    .day-lbl {
      font-size: 0.5rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .day-dots { display: flex; flex-direction: column; gap: 3px; align-items: center; }
    .d-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border);
    }
    .d-dot.b-done { background: var(--biscottos); }
    .d-dot.l-done { background: var(--lecture); }
    .d-dot.f-done { background: var(--flow); }

    .recap-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .rs-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 12px;
    }
    .rs-val {
      display: block;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.03em;
      margin-bottom: 3px;
    }
    .rs-lbl {
      font-size: 0.58rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .recap-msg {
      margin-top: 18px;
      padding: 14px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--sub);
      line-height: 1.65;
      font-style: italic;
    }

    .btn-close {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--sub);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── LEVEL-UP OVERLAY ─────────────────────── */
    #lu-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #lu-overlay.show {
      display: flex;
      animation: lu-bg 4s forwards;
    }
    @keyframes lu-bg {
      0%   { background: rgba(0,0,0,0); }
      14%  { background: rgba(0,0,0,.88); }
      80%  { background: rgba(0,0,0,.88); }
      100% { background: rgba(0,0,0,0); }
    }
    .lu-content {
      text-align: center;
      animation: lu-pop 4s forwards;
    }
    @keyframes lu-pop {
      0%   { opacity: 0; transform: scale(.72) translateY(24px); }
      14%  { opacity: 1; transform: scale(1.05); }
      22%  { transform: scale(1); }
      78%  { opacity: 1; }
      100% { opacity: 0; transform: scale(.9); }
    }
    .lu-sup {
      font-size: 0.6rem;
      font-weight: 700;
      color: rgba(255,255,255,.4);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .lu-num {
      font-size: 7.5rem;
      font-weight: 900;
      color: #fff;
      line-height: 1;
      letter-spacing: -0.07em;
      margin-bottom: 10px;
    }
    .lu-stage-lbl {
      font-size: 1rem;
      font-weight: 700;
      color: rgba(255,255,255,.6);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── PERFECT DAY FLASH ───────────────────── */
    #perfect-flash {
      position: fixed;
      inset: 0;
      z-index: 150;
      pointer-events: none;
      display: none;
    }
    #perfect-flash.show {
      display: block;
      animation: pday-flash .7s ease-out forwards;
    }
    @keyframes pday-flash {
      0%   { background: rgba(255,214,10,0); }
      30%  { background: rgba(255,214,10,.14); }
      100% { background: rgba(255,214,10,0); }
    }

    /* ── TOAST ────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%) translateY(88px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 26px;
      white-space: nowrap;
      z-index: 300;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
      transition: transform .32s cubic-bezier(.34,1.56,.64,1);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="app" id="app" data-stage="1">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-day-badge" id="day-badge">—</div>

    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <svg class="avatar-svg" viewBox="0 0 160 186" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- STAGE 1 · Le Départ — posture molle, hoodie gris, regard vide -->
        <g class="av-stage active" id="av-s1">
          <!-- hair -->
          <path d="M60 30 Q63 11 80 10 Q97 11 100 30 Q92 21 80 21 Q68 21 60 30Z" fill="#1A1414"/>
          <!-- head -->
          <circle cx="80" cy="33" r="21" fill="#DCA07A"/>
          <!-- ears -->
          <ellipse cx="59" cy="34" rx="3.5" ry="5" fill="#C8906A"/>
          <ellipse cx="101" cy="34" rx="3.5" ry="5" fill="#C8906A"/>
          <!-- eyes — mi-clos, fatigués -->
          <ellipse cx="73" cy="32" rx="3.2" ry="2.4" fill="#1A1414"/>
          <ellipse cx="87" cy="32" rx="3.2" ry="2.4" fill="#1A1414"/>
          <ellipse cx="74" cy="31" rx="1" ry="0.8" fill="rgba(255,255,255,0.65)"/>
          <ellipse cx="88" cy="31" rx="1" ry="0.8" fill="rgba(255,255,255,0.65)"/>
          <!-- mouth neutre / légère moue -->
          <path d="M75 43 Q80 45 85 43" stroke="#B87850" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <!-- neck -->
          <rect x="73" y="53" width="14" height="11" rx="4" fill="#C8906A"/>
          <!-- torso hoodie gris — épaules tombantes, peu de taper -->
          <path d="M50 68 Q58 61 80 60 Q102 61 110 68 L107 122 L53 122 Z" fill="#8C97A8"/>
          <!-- shoulder caps ronds et tombants -->
          <ellipse cx="51" cy="67" rx="10" ry="7" fill="#8C97A8"/>
          <ellipse cx="109" cy="67" rx="10" ry="7" fill="#8C97A8"/>
          <!-- hoodie details -->
          <path d="M70 61 Q80 69 90 61" stroke="#7B8799" stroke-width="2" fill="none" stroke-linecap="round"/>
          <line x1="80" y1="69" x2="80" y2="122" stroke="#7B8799" stroke-width="1.5" opacity="0.6"/>
          <rect x="63" y="96" width="34" height="20" rx="5" fill="#7B8799"/>
          <!-- bras gauche — pendu -->
          <path d="M42 74 Q35 98 34 118 Q33 126 36 132" stroke="#8C97A8" stroke-width="14" stroke-linecap="round" fill="none"/>
          <circle cx="37" cy="135" r="7" fill="#DCA07A"/>
          <!-- bras droit — pendu -->
          <path d="M118 74 Q125 98 126 118 Q127 126 124 132" stroke="#8C97A8" stroke-width="14" stroke-linecap="round" fill="none"/>
          <circle cx="123" cy="135" r="7" fill="#DCA07A"/>
          <!-- jambes serrées, pantalon sombre -->
          <path d="M66 122 Q64 144 63 164" stroke="#3A4050" stroke-width="13" stroke-linecap="round" fill="none"/>
          <path d="M94 122 Q96 144 97 164" stroke="#3A4050" stroke-width="13" stroke-linecap="round" fill="none"/>
          <!-- chaussures basiques -->
          <ellipse cx="63" cy="168" rx="13" ry="5.5" fill="#2A2E3C"/>
          <ellipse cx="97" cy="168" rx="13" ry="5.5" fill="#2A2E3C"/>
        </g>

        <!-- STAGE 2 · En Route — posture droite, tenue training bleu -->
        <g class="av-stage" id="av-s2">
          <!-- hair -->
          <path d="M60 27 Q63 8 80 7 Q97 8 100 27 Q92 18 80 18 Q68 18 60 27Z" fill="#1A1414"/>
          <!-- head -->
          <circle cx="80" cy="30" r="21" fill="#DCA07A"/>
          <!-- ears -->
          <ellipse cx="59" cy="31" rx="3.5" ry="5" fill="#C8906A"/>
          <ellipse cx="101" cy="31" rx="3.5" ry="5" fill="#C8906A"/>
          <!-- eyes — ouverts, déterminés -->
          <ellipse cx="73" cy="29" rx="3.4" ry="3" fill="#1A1414"/>
          <ellipse cx="87" cy="29" rx="3.4" ry="3" fill="#1A1414"/>
          <ellipse cx="74" cy="28" rx="1.1" ry="1" fill="rgba(255,255,255,0.8)"/>
          <ellipse cx="88" cy="28" rx="1.1" ry="1" fill="rgba(255,255,255,0.8)"/>
          <!-- sourcils droits, déterminé -->
          <path d="M69 23 Q73 22 77 23" stroke="#8B5E3C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M83 23 Q87 22 91 23" stroke="#8B5E3C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <!-- mouth légère esquisse sourire -->
          <path d="M75 40 Q80 43 85 40" stroke="#B87850" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <!-- neck -->
          <rect x="73" y="50" width="14" height="11" rx="4" fill="#C8906A"/>
          <!-- torso athletic bleu — épaules plus larges, V-taper léger -->
          <path d="M44 64 Q57 57 80 56 Q103 57 116 64 L110 122 L50 122 Z" fill="#3A7ED8"/>
          <!-- shoulder caps plus larges -->
          <ellipse cx="45" cy="63" rx="12" ry="8.5" fill="#3A7ED8"/>
          <ellipse cx="115" cy="63" rx="12" ry="8.5" fill="#3A7ED8"/>
          <!-- col et détails -->
          <path d="M70 57 Q80 65 90 57" stroke="#2A6EC8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <!-- bandes latérales -->
          <path d="M45 68 Q51 95 50 122" stroke="#2A6EC8" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>
          <path d="M115 68 Q109 95 110 122" stroke="#2A6EC8" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>
          <!-- bras gauche — légèrement écarté -->
          <path d="M35 70 Q27 94 27 116 Q27 124 30 130" stroke="#3A7ED8" stroke-width="14" stroke-linecap="round" fill="none"/>
          <circle cx="31" cy="133" r="7" fill="#DCA07A"/>
          <!-- bras droit — légèrement écarté -->
          <path d="M125 70 Q133 94 133 116 Q133 124 130 130" stroke="#3A7ED8" stroke-width="14" stroke-linecap="round" fill="none"/>
          <circle cx="129" cy="133" r="7" fill="#DCA07A"/>

<!-- PERFECT DAY FLASH -->
<div id="perfect-flash"></div>

<!-- TOAST -->
<div id="toast"></div>

<script>
/* ── CONFIG ─────────────────────────────────── */
const QUESTS = {
  biscottos: { id:'biscottos', name:'La Quête des Biscottos', minTime:20*60, xp:50 },
  lecture:   { id:'lecture',   name:'Cerveau en Feu',         minTime:15*60, xp:35 },
  flow:      { id:'flow',      name:'Dans la Zone',           minTime:30*60, xp:55 }
};

const LEVEL_XP = [
  0,150,350,600,1000,1500,2100,2800,3600,4600,
  5800,7200,8800,10600,12800,15300,18100,21200,24600,28400,
  32500,37000,42000,47500,53500,60000,67500,76000,85000,95000
];

const STAGE_NAMES = ['Le Départ','En Route','Affûté','La Légende'];
const BONUS_XP = 30;

/* ── STATE ──────────────────────────────────── */
const freshTimers = () => ({
  biscottos: { running:false, elapsed:0, startTs:null, completed:false },
  lecture:   { running:false, elapsed:0, startTs:null, completed:false },
  flow:      { running:false, elapsed:0, startTs:null, completed:false }
});

let state;
const ticks = {};

function loadState() {
  try {
    const raw = localStorage.getItem('rpg_v2');
    if (raw) {
      const s = JSON.parse(raw);
      const today = dateKey(new Date());
      if (s.lastDate && s.lastDate !== today) {
        const prev = dateKey(shiftDays(-1));
        if (!(s.log[prev]||{}).any && s.streak > 0) s.streak = 0;
        s.timers = freshTimers();
      }
      s.lastDate = today;
      return s;
    }
  } catch(_) {}
  return { totalXP:0, streak:0, totalDays:0,
           lastDate:dateKey(new Date()), log:{}, timers:freshTimers() };
}

function save() { localStorage.setItem('rpg_v2', JSON.stringify(state)); }

/* ── DATE UTILS ─────────────────────────────── */
function dateKey(d) { return d.toISOString().split('T')[0]; }
function shiftDays(n) { const d=new Date(); d.setDate(d.getDate()+n); return d; }

function todayLog() {
  const k = dateKey(new Date());
  if (!state.log[k]) state.log[k] = {
    biscottos:false, lecture:false, flow:false, any:false,
    bonusAwarded:false, xp:0, firstCompleted:false,
    biscottosTime:0, lectureTime:0, flowTime:0
  };
  return state.log[k];
}

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function fmtDur(s) {
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  return h>0 ? `${h}h${String(m).padStart(2,'0')}` : `${m} min`;
}

/* ── LEVEL / XP ─────────────────────────────── */
function getLevel(xp) {
  for (let i=LEVEL_XP.length-1; i>=0; i--)
    if (xp>=LEVEL_XP[i]) return i+1;
  return 1;
}
function lvProgress(xp) {
  const lv  = getLevel(xp);
  const cur  = LEVEL_XP[lv-1]||0;
  const next = LEVEL_XP[lv]||LEVEL_XP[LEVEL_XP.length-1]+10000;
  return { pct:Math.min(100,(xp-cur)/(next-cur)*100), prog:xp-cur, total:next-cur, lv };
}
function getStage(lv) {
  if (lv>=30) return 4;
  if (lv>=15) return 3;
  if (lv>=5)  return 2;
  return 1;
}

/* ── TIMER ENGINE ───────────────────────────── */
function elapsed(id) {
  const t = state.timers[id];
  if (!t.running || !t.startTs) return t.elapsed;
  return t.elapsed + Math.floor((Date.now()-t.startTs)/1000);
}

function toggleTimer(id) {
  const t = state.timers[id];
  if (t.completed) return;
  if (t.running) {
    t.elapsed = elapsed(id);
    t.running = false; t.startTs = null;
    clearInterval(ticks[id]); delete ticks[id];
  } else {
    t.running = true; t.startTs = Date.now();
    ticks[id] = setInterval(() => renderCard(id), 1000);
  }
  save(); renderCard(id);
}

function completeQuest(id) {
  const t = state.timers[id];
  if (t.completed) return;
  t.elapsed = elapsed(id);
  t.running = false; t.startTs = null;
  clearInterval(ticks[id]); delete ticks[id];
  t.completed = true;

  const log = todayLog();
  log[id] = true; log.any = true; log[`${id}Time`] = t.elapsed;

  const prevLv = getLevel(state.totalXP);
  state.totalXP += QUESTS[id].xp;
  log.xp = (log.xp||0) + QUESTS[id].xp;

  if (log.biscottos && log.lecture && log.flow && !log.bonusAwarded) {
    state.totalXP += BONUS_XP;
    log.xp += BONUS_XP;
    log.bonusAwarded = true;
    setTimeout(() => {
      flash(); toast(`⭐ Journée parfaite · Bonus +${BONUS_XP} XP !`);
    }, 900);
  }

  if (!log.firstCompleted) {
    log.firstCompleted = true;
    state.totalDays++;
    state.streak++;
  }

  save();
  const newLv = getLevel(state.totalXP);
  if (newLv > prevLv) setTimeout(() => showLevelUp(newLv, prevLv), 900);
  toast(`+${QUESTS[id].xp} XP · ${QUESTS[id].name}`);
  renderAll();
}

/* ── RENDER ─────────────────────────────────── */
function renderCard(id) {
  const t   = state.timers[id];
  const el  = elapsed(id);
  const pct = Math.min(100, el/QUESTS[id].minTime*100);
  const ok  = el >= QUESTS[id].minTime;

  const fill = document.getElementById(`qf-${id}`);
  if (fill) fill.style.width = `${pct}%`;

  const card = document.getElementById(`qcard-${id}`);
  if (card) card.classList.toggle('done', t.completed);

  const area = document.getElementById(`qa-${id}`);
  if (!area) return;

  if (t.completed) {
    area.innerHTML = `<div class="badge-done">✓ ${fmt(t.elapsed)}</div>`;
  } else if (ok && t.running) {
    area.innerHTML = `<button class="btn-complete" onclick="completeQuest('${id}')">Terminer</button>`;
  } else {
    area.innerHTML = `<button class="btn-timer ${t.running?'running':''}" onclick="toggleTimer('${id}')">${t.running?'⏸':'▶'} ${fmt(el)}</button>`;
  }
}

function renderHero() {
  const { pct, prog, total, lv } = lvProgress(state.totalXP);
  const stage = getStage(lv);

  document.getElementById('hero-lv').textContent = lv;
  document.getElementById('hero-stage').textContent = STAGE_NAMES[stage-1];
  document.getElementById('xp-fill').style.width = `${pct}%`;
  document.getElementById('xp-lbl').textContent = `${prog} / ${total} XP`;

  for (let s=1; s<=4; s++) {
    const g = document.getElementById(`av-s${s}`);
    if (g) g.classList.toggle('active', s===stage);
  }
  document.getElementById('app').dataset.stage = stage;
}

function renderStats() {
  document.getElementById('stat-streak').textContent = state.streak;
  document.getElementById('stat-days').textContent   = state.totalDays;
  document.getElementById('stat-xp').textContent     = state.totalXP;
}

function renderDate() {
  const d = new Date();
  document.getElementById('date-text').textContent =
    d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
  const s = state.streak;
  document.getElementById('day-badge').textContent =
    `Jour ${state.totalDays + 1}  ·  Série ${s}${s>0?' 🔥':''}`;
}

function renderAll() {
  renderHero();
  renderStats();
  renderDate();
  Object.keys(QUESTS).forEach(id => renderCard(id));
}

/* ── ANIMATIONS ─────────────────────────────── */
function flash() {
  const el = document.getElementById('perfect-flash');
  el.classList.remove('show'); void el.offsetWidth;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 800);
}

function showLevelUp(newLv, prevLv) {
  const stage = getStage(newLv);
  const changed = stage !== getStage(prevLv);
  document.getElementById('lu-num').textContent = newLv;
  document.getElementById('lu-stage').textContent = changed ? STAGE_NAMES[stage-1] : '';
  const ov = document.getElementById('lu-overlay');
  ov.classList.remove('show'); void ov.offsetWidth;
  ov.classList.add('show'); ov.style.pointerEvents = 'all';
  setTimeout(() => { ov.classList.remove('show'); ov.style.pointerEvents = 'none'; }, 4100);
}

/* ── RECAP ──────────────────────────────────── */
function openRecap()  { buildRecap(); document.getElementById('recap-modal').classList.add('open'); }
function closeRecap() { document.getElementById('recap-modal').classList.remove('open'); }

function buildRecap() {
  const today = dateKey(new Date());
  const dow = new Date().getDay();
  const off = dow===0 ? -6 : 1-dow;
  const LABELS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const days = Array.from({length:7}, (_,i) => dateKey(shiftDays(off+i)));

  let wXP=0, wQ=0, wB=0, wL=0, wF=0;
  const squares = days.map((d,i) => {
    const log = state.log[d]||{};
    const done = (log.biscottos?1:0)+(log.lecture?1:0)+(log.flow?1:0);
    wXP+=log.xp||0; wQ+=done;
    wB+=log.biscottosTime||0; wL+=log.lectureTime||0; wF+=log.flowTime||0;
    const cls = d===today ? 'today' : d>today ? 'future' : done>0 ? 'active' : '';
    return `<div class="day-sq ${cls}">
      <span class="day-lbl">${LABELS[i]}</span>
      <div class="day-dots">
        <span class="d-dot ${log.biscottos?'b-done':''}"></span>
        <span class="d-dot ${log.lecture?'l-done':''}"></span>
        <span class="d-dot ${log.flow?'f-done':''}"></span>
      </div></div>`;
  }).join('');

  const activeDays = days.filter(d => (state.log[d]||{}).any).length;
  document.getElementById('modal-sub').textContent =
    `${activeDays} jour${activeDays>1?'s':''} actif${activeDays>1?'s':''} cette semaine`;

  const msgs = [
    '"La régularité bat l\'intensité, chaque fois."',
    '"Tu construis quelque chose de réel. Ça prend du temps."',
    '"Chaque rep, chaque page, chaque session — ça compte."',
    '"Les champions sont faits de choses imperceptibles."',
    '"Discipline = liberté."'
  ];

  document.getElementById('recap-body').innerHTML = `
    <div class="week-grid">${squares}</div>
    <div class="recap-stats">
      <div class="rs-card"><span class="rs-val">${wXP}</span><span class="rs-lbl">⚡ XP</span></div>
      <div class="rs-card"><span class="rs-val">${wQ}</span><span class="rs-lbl">Quêtes</span></div>
      <div class="rs-card"><span class="rs-val">${fmtDur(wB)}</span><span class="rs-lbl">💪 Biscottos</span></div>
      <div class="rs-card"><span class="rs-val">${fmtDur(wL)}</span><span class="rs-lbl">📖 Lecture</span></div>
      <div class="rs-card"><span class="rs-val">${fmtDur(wF)}</span><span class="rs-lbl">🎯 Deep work</span></div>
      <div class="rs-card"><span class="rs-val">${state.streak}</span><span class="rs-lbl">🔥 Série</span></div>
    </div>
    <div class="recap-msg">${msgs[Math.floor(Math.random()*msgs.length)]}</div>`;
}

/* ── TOAST ──────────────────────────────────── */
let toastTmr;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => el.classList.remove('show'), 3500);
}

/* ── INIT ───────────────────────────────────── */
function init() {
  state = loadState();
  Object.keys(QUESTS).forEach(id => {
    if (state.timers[id].running)
      ticks[id] = setInterval(() => renderCard(id), 1000);
  });
  renderAll();
}

document.getElementById('recap-modal').addEventListener('click', e => {
  if (e.target===e.currentTarget) closeRecap();
});

document.addEventListener('DOMContentLoaded', init);
</script>
</body>

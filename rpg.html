<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#06070f">
  <title>RPG — Matthieu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ============================
       RESET & BASE
    ============================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:          #c9a440;
      --gold-bright:   #ffd76a;
      --gold-dim:      #7a621e;
      --bg:            #06070f;
      --bg2:           #0c0e1c;
      --surface:       #101224;
      --surface2:      #141728;
      --border:        #1c2040;
      --border-b:      #2a3060;
      --text:          #ddd6c4;
      --muted:         #5a6080;
      --corps:         #d94040;
      --esprit:        #3a78e8;
      --focus:         #8a35c8;
      --success:       #40c870;
      --font-title:    'Cinzel', serif;
      --font-hero:     'Cinzel Decorative', serif;
      --font-body:     'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    button { touch-action: manipulation; }

    /* ============================
       BACKGROUND
    ============================ */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .bg-gradient {
      background:
        linear-gradient(to bottom, rgba(6,7,15,0.72) 0%, rgba(6,7,15,0.88) 55%, rgba(6,7,15,0.97) 100%),
        radial-gradient(ellipse 80% 50% at 50% 0%, #0e1840 0%, transparent 60%),
        url('https://d8j0ntlcm91z4.cloudfront.net/user_3A7Wo6kZOzhZoM3hSwPQckkfm2N/hf_20260617_124347_e86857ff-2b7b-4c7c-8f66-b9ae010484fe.png')
          center top / cover no-repeat,
        #06070f;
    }

    .bg-grid {
      background-image:
        linear-gradient(rgba(42,48,96,0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(42,48,96,0.18) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
    }

    .bg-mountains {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
    }

    .bg-vignette {
      background: radial-gradient(ellipse at center, transparent 40%, rgba(6,7,15,0.7) 100%);
    }

    #particles { position: absolute; inset: 0; overflow: hidden; }

    .pt {
      position: absolute;
      border-radius: 50%;
      background: rgba(201,164,64,0.55);
      animation: pt-rise var(--d,8s) var(--dl,0s) infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pt-rise {
      0%   { transform: translateY(0)   scale(0.3); opacity: 0; }
      15%  { opacity: 0.7; }
      85%  { opacity: 0.3; }
      100% { transform: translateY(-130px) scale(1); opacity: 0; }
    }

    /* ============================
       LAYOUT
    ============================ */
    .app {
      position: relative;
      z-index: 1;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 16px 96px;
      min-height: 100dvh;
    }

    /* ============================
       HERO
    ============================ */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 28px;
      padding-bottom: 12px;
    }

    /* === Avatar SVG === */
    .avatar-wrap {
      position: relative;
      width: 180px;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    /* Aura rings behind avatar */
    .avatar-aura {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.8s, box-shadow 0.8s;
    }

    .warrior-svg {
      width: 160px;
      height: 200px;
      transition: filter 0.8s;
      position: relative;
      z-index: 2;
    }

    /* CSS variables per element class */
    .warrior-svg .el-body     { fill: var(--w-body); }
    .warrior-svg .el-armor    { fill: var(--w-armor); }
    .warrior-svg .el-accent   { fill: var(--w-accent); }
    .warrior-svg .el-eye      { fill: var(--w-eye); }
    .warrior-svg .el-staff    { fill: var(--w-staff); }
    .warrior-svg .el-gem      { fill: var(--w-gem); }
    .warrior-svg .el-boot     { fill: var(--w-boot); }
    .warrior-svg .el-hood     { fill: var(--w-hood); }
    .warrior-svg .el-particle { opacity: 0; }
    .warrior-svg .el-aura-ring { opacity: 0; fill: none; stroke: var(--w-gem); }

    /* Stage 1 — L'Apprenti */
    #avatar-container.stage-1 {
      --w-body:   #28283c;
      --w-armor:  #1c1c2e;
      --w-accent: #3a3a50;
      --w-eye:    #5a5a70;
      --w-staff:  #444458;
      --w-gem:    #5a5a70;
      --w-boot:   #181824;
      --w-hood:   #20202e;
    }
    #avatar-container.stage-1 .warrior-svg { filter: none; opacity: 0.8; }

    /* Stage 2 — Le Disciple */
    #avatar-container.stage-2 {
      --w-body:   #1c2e60;
      --w-armor:  #243270;
      --w-accent: #3a5cc0;
      --w-eye:    #70aaff;
      --w-staff:  #2858c0;
      --w-gem:    #60a0ff;
      --w-boot:   #101830;
      --w-hood:   #0e1a45;
    }
    #avatar-container.stage-2 .warrior-svg {
      filter: drop-shadow(0 0 10px rgba(56,120,232,0.55));
    }
    #avatar-container.stage-2 .avatar-aura {
      opacity: 1;
      box-shadow: 0 0 40px 10px rgba(56,120,232,0.12);
    }
    #avatar-container.stage-2 .el-particle { opacity: 0.35; fill: #60a0ff; }

    /* Stage 3 — Le Maître */
    #avatar-container.stage-3 {
      --w-body:   #4a2e12;
      --w-armor:  #5c3818;
      --w-accent: #b07828;
      --w-eye:    #ffd060;
      --w-staff:  #c09028;
      --w-gem:    #ffe060;
      --w-boot:   #2a1608;
      --w-hood:   #2e1a08;
    }
    #avatar-container.stage-3 .warrior-svg {
      filter: drop-shadow(0 0 16px rgba(220,160,40,0.65));
    }
    #avatar-container.stage-3 .avatar-aura {
      opacity: 1;
      box-shadow: 0 0 60px 15px rgba(200,150,32,0.16);
    }
    #avatar-container.stage-3 .el-particle {
      opacity: 0.65;
      fill: #ffd060;
      animation: pt-float 3s ease-in-out infinite;
    }
    #avatar-container.stage-3 .el-aura-ring { opacity: 0.15; stroke-width: 1; }

    /* Stage 4 — La Légende */
    #avatar-container.stage-4 {
      --w-body:   #7a4818;
      --w-armor:  #906028;
      --w-accent: #e0a030;
      --w-eye:    #ffffff;
      --w-staff:  #d09428;
      --w-gem:    #ffe870;
      --w-boot:   #3a1e04;
      --w-hood:   #3c1e04;
    }
    #avatar-container.stage-4 .warrior-svg {
      filter:
        drop-shadow(0 0 20px rgba(255,210,60,0.8))
        drop-shadow(0 0 50px rgba(255,180,40,0.4));
      animation: divine-pulse 2.5s ease-in-out infinite;
    }
    #avatar-container.stage-4 .avatar-aura {
      opacity: 1;
      box-shadow: 0 0 80px 20px rgba(220,170,30,0.2);
    }
    #avatar-container.stage-4 .el-particle {
      opacity: 0.9;
      fill: #ffe870;
      animation: pt-float 2s ease-in-out infinite;
    }
    #avatar-container.stage-4 .el-aura-ring { opacity: 0.3; stroke-width: 1.5; }

    .el-particle.p2 { animation-delay: 0.5s; }
    .el-particle.p3 { animation-delay: 1s; }
    .el-particle.p4 { animation-delay: 1.5s; }
    .el-particle.p5 { animation-delay: 2s; }
    .el-particle.p6 { animation-delay: 2.5s; }

    @keyframes pt-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    @keyframes divine-pulse {
      0%, 100% {
        filter: drop-shadow(0 0 20px rgba(255,210,60,0.8)) drop-shadow(0 0 50px rgba(255,180,40,0.4));
      }
      50% {
        filter: drop-shadow(0 0 30px rgba(255,220,80,1)) drop-shadow(0 0 70px rgba(255,190,50,0.6));
      }
    }

    /* === Character info === */
    .char-name {
      font-family: var(--font-hero);
      font-size: 1.5rem;
      letter-spacing: 0.15em;
      color: var(--gold-bright);
      text-shadow: 0 0 30px rgba(201,164,64,0.5), 0 2px 4px rgba(0,0,0,0.6);
      margin-bottom: 4px;
      text-align: center;
    }

    .char-level {
      font-family: var(--font-title);
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 3px;
      text-align: center;
    }

    .char-stage {
      font-family: var(--font-title);
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      color: var(--gold-dim);
      margin-bottom: 14px;
      text-align: center;
    }

    .xp-wrap {
      width: 230px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }

    .xp-track {
      width: 100%;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .xp-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright));
      border-radius: 3px;
      transition: width 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
    }

    .xp-bar::after {
      content: '';
      position: absolute;
      right: -4px;
      top: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold-bright);
      box-shadow: 0 0 8px var(--gold-bright);
      opacity: 0.9;
    }

    .xp-label {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      font-family: var(--font-title);
    }

    /* ============================
       DAY DIVIDER
    ============================ */
    .day-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 18px;
    }

    .day-divider::before, .day-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-b), transparent);
    }

    .day-text {
      font-family: var(--font-title);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      white-space: nowrap;
      text-transform: uppercase;
    }

    /* ============================
       QUEST CARDS
    ============================ */
    .quests { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }

    .quest-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.35s, box-shadow 0.35s;
      --qc: var(--muted);
    }

    .quest-card[data-quest="corps"]  { --qc: var(--corps); }
    .quest-card[data-quest="esprit"] { --qc: var(--esprit); }
    .quest-card[data-quest="focus"]  { --qc: var(--focus); }

    .quest-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--qc);
      border-radius: 3px 0 0 3px;
    }

    .quest-card.completed {
      border-color: var(--qc);
      box-shadow: 0 0 22px -8px var(--qc);
    }

    .quest-card.completed::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--qc) 0%, transparent 45%);
      opacity: 0.055;
      pointer-events: none;
    }

    .quest-card.timer-running {
      border-color: var(--qc);
      animation: card-pulse 2s ease-in-out infinite;
    }

    @keyframes card-pulse {
      0%, 100% { box-shadow: 0 0 0 0 transparent; }
      50%       { box-shadow: 0 0 14px -4px var(--qc); }
    }

    .q-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .q-info { flex: 1; min-width: 0; }

    .q-name {
      font-family: var(--font-title);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--qc);
      text-transform: uppercase;
      margin-bottom: 1px;
    }

    .q-desc {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .q-mini-track {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .q-mini-fill {
      height: 100%;
      width: 0%;
      background: var(--qc);
      border-radius: 2px;
      transition: width 1s linear;
    }

    /* Action area */
    .q-action { flex-shrink: 0; }

    .btn-timer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 9px 13px;
      min-height: 48px;
      min-width: 64px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      color: var(--text);
      transition: border-color 0.2s, background 0.2s;
      font-family: var(--font-body);
    }

    .btn-timer:hover { border-color: var(--qc); }

    .btn-timer.running {
      border-color: var(--qc);
      background: var(--surface);
    }

    .btn-timer .t-icon { font-size: 0.75rem; color: var(--qc); line-height: 1; }
    .btn-timer .t-time { font-family: 'Courier New', monospace; font-size: 0.82rem; letter-spacing: 0.04em; }

    .btn-complete {
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--qc), rgba(255,255,255,0.1));
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      font-family: var(--font-title);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      animation: pulse-btn 1.5s ease-in-out infinite;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    @keyframes pulse-btn {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 transparent; }
      50% { transform: scale(1.04); box-shadow: 0 0 16px -4px var(--qc); }
    }

    .badge-done {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 9px 12px;
      color: var(--qc);
      font-family: var(--font-title);
      font-size: 0.6rem;
      letter-spacing: 0.12em;
    }

    .badge-done .check { font-size: 1.1rem; }

    /* ============================
       STATS ROW
    ============================ */
    .stats-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-card {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-val {
      font-family: var(--font-title);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold-bright);
      line-height: 1;
    }

    .stat-lbl {
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ============================
       RECAP BUTTON
    ============================ */
    .btn-recap {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-family: var(--font-title);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-recap:hover { border-color: var(--gold-dim); color: var(--gold); }

    /* ============================
       MODALS
    ============================ */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(6,7,15,0.92);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .modal-bg.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--border-b);
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px;
      position: relative;
      max-height: 85vh;
      overflow-y: auto;
      animation: slide-up 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    @keyframes slide-up {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border-b);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .modal-title {
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--gold-bright);
      text-align: center;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    /* Weekly recap content */
    .week-grid {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
      justify-content: center;
    }

    .day-sq {
      flex: 1;
      max-width: 48px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .day-sq.active  { border-color: var(--gold-dim); }
    .day-sq.today   { border-color: var(--gold); background: rgba(201,164,64,0.05); }
    .day-sq.future  { opacity: 0.3; }

    .day-lbl {
      font-family: var(--font-title);
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .day-dots { display: flex; flex-direction: column; gap: 3px; align-items: center; }

    .d-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1px solid var(--border-b);
      background: transparent;
      transition: background 0.3s;
    }

    .d-dot.corps-done  { background: var(--corps);  border-color: var(--corps); }
    .d-dot.esprit-done { background: var(--esprit); border-color: var(--esprit); }
    .d-dot.focus-done  { background: var(--focus);  border-color: var(--focus); }

    .recap-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .rs-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .rs-val {
      font-family: var(--font-title);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold-bright);
    }

    .rs-lbl {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .recap-msg {
      margin-top: 20px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.6;
      font-style: italic;
    }

    .btn-close {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--border-b);
      border-radius: 10px;
      color: var(--muted);
      font-family: var(--font-title);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-close:hover { border-color: var(--gold-dim); color: var(--gold); }

    /* ============================
       LEVEL-UP OVERLAY
    ============================ */
    #lu-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #lu-overlay.show {
      display: flex;
      animation: lu-bg 3.8s forwards;
    }

    @keyframes lu-bg {
      0%   { background: rgba(6,7,15,0); }
      18%  { background: rgba(6,7,15,0.88); }
      80%  { background: rgba(6,7,15,0.88); }
      100% { background: rgba(6,7,15,0); }
    }

    .lu-content {
      text-align: center;
      animation: lu-in 3.8s forwards;
    }

    @keyframes lu-in {
      0%   { opacity: 0; transform: scale(0.7); }
      18%  { opacity: 1; transform: scale(1.05); }
      25%  { transform: scale(1); }
      80%  { opacity: 1; }
      100% { opacity: 0; transform: scale(1.1); }
    }

    .lu-label {
      font-family: var(--font-title);
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .lu-number {
      font-family: var(--font-hero);
      font-size: 5rem;
      color: var(--gold-bright);
      line-height: 1;
      text-shadow: 0 0 40px rgba(255,215,106,0.8), 0 0 80px rgba(201,164,64,0.4);
      margin-bottom: 8px;
    }

    .lu-stage {
      font-family: var(--font-title);
      font-size: 1rem;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .lu-rays {
      position: absolute;
      inset: -100px;
      background: conic-gradient(from 0deg,
        transparent 0deg, rgba(201,164,64,0.08) 10deg,
        transparent 20deg, rgba(201,164,64,0.06) 30deg,
        transparent 40deg, rgba(201,164,64,0.08) 50deg,
        transparent 60deg, rgba(201,164,64,0.06) 70deg,
        transparent 80deg, rgba(201,164,64,0.08) 90deg,
        transparent 100deg, rgba(201,164,64,0.06) 110deg,
        transparent 120deg, rgba(201,164,64,0.08) 130deg,
        transparent 140deg, rgba(201,164,64,0.06) 150deg,
        transparent 160deg, rgba(201,164,64,0.08) 170deg,
        transparent 180deg, rgba(201,164,64,0.06) 190deg,
        transparent 200deg, rgba(201,164,64,0.08) 210deg,
        transparent 220deg, rgba(201,164,64,0.06) 230deg,
        transparent 240deg, rgba(201,164,64,0.08) 250deg,
        transparent 260deg, rgba(201,164,64,0.06) 270deg,
        transparent 280deg, rgba(201,164,64,0.08) 290deg,
        transparent 300deg, rgba(201,164,64,0.06) 310deg,
        transparent 320deg, rgba(201,164,64,0.08) 330deg,

      );
      z-index: -1;
      animation: spin-rays 6s linear infinite;
    }

    @keyframes spin-rays { to { transform: rotate(360deg); } }

    /* ============================
       TOAST
    ============================ */
    #toast {
      position: fixed;
      bottom: 28px;

  <!-- TOAST -->
  <div id="toast"></div>

  <script>
  /* =============================================
     CONFIGURATION
  ============================================= */
  const QUESTS = {
    corps:  { id: 'corps',  name: 'Corps',  minTime: 20 * 60, xp: 50 },
    esprit: { id: 'esprit', name: 'Esprit', minTime: 15 * 60, xp: 40 },
    focus:  { id: 'focus',  name: 'Focus',  minTime: 30 * 60, xp: 60 }
  };

  // Total XP needed to reach each level (index = level - 1)
  const LEVEL_XP = [
    0, 150, 350, 600, 1000, 1500, 2100, 2800, 3600, 4600,
    5800, 7200, 8800, 10600, 12800, 15300, 18100, 21200, 24600, 28400,
    32500, 37000, 42000, 47500, 53500, 60000, 67500, 76000, 85000, 95000
  ];

  const STAGE_LABELS = ['L\'Apprenti', 'Le Disciple', 'Le Maître', 'La Légende'];
  const BONUS_ALL_XP = 30;

  /* =============================================
     STATE
  ============================================= */
  const DEFAULT_TIMERS = () => ({
    corps:  { running: false, elapsed: 0, startTs: null, completed: false },
    esprit: { running: false, elapsed: 0, startTs: null, completed: false },
    focus:  { running: false, elapsed: 0, startTs: null, completed: false }
  });

  let state;
  const intervals = {};

  function loadState() {
    try {
      const raw = localStorage.getItem('rpg_v1');
      if (raw) {
        const s = JSON.parse(raw);
        const today = getToday();

        // Day changed: check streak, reset timers
        if (s.lastDate && s.lastDate !== today) {
          const yesterday = shiftDate(-1);
          const hadActivity = (s.log[yesterday] || {}).any;
          if (!hadActivity && s.streak > 0) s.streak = 0;
          s.timers = DEFAULT_TIMERS();
        }

        s.lastDate = today;
        return s;
      }
    } catch (_) {}

    return {
      totalXP: 0,
      streak: 0,
      totalDays: 0,
      lastDate: getToday(),
      log: {},      // { 'YYYY-MM-DD': { corps, esprit, focus, any, bonusAwarded, xp, corpsTime, espritTime, focusTime, firstCompleted } }
      timers: DEFAULT_TIMERS()
    };
  }

  function save() {
    localStorage.setItem('rpg_v1', JSON.stringify(state));
  }

  /* =============================================
     DATE UTILITIES
  ============================================= */
  function getToday() {
    return new Date().toISOString().split('T')[0];
  }

  function shiftDate(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString().split('T')[0];
  }

  function todayLog() {
    const t = getToday();
    if (!state.log[t]) {
      state.log[t] = { corps: false, esprit: false, focus: false, any: false,
                       bonusAwarded: false, xp: 0, firstCompleted: false,
                       corpsTime: 0, espritTime: 0, focusTime: 0 };
    }
    return state.log[t];
  }

  function fmt(secs) {
    const m = Math.floor(secs / 60), s = secs % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function fmtDuration(secs) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    if (h > 0) return `${h}h${String(m).padStart(2,'0')}`;
    return `${m} min`;
  }

  /* =============================================
     LEVEL / XP
  ============================================= */
  function getLevel(xp) {
    for (let i = LEVEL_XP.length - 1; i >= 0; i--) {
      if (xp >= LEVEL_XP[i]) return i + 1;
    }
    return 1;
  }

  function getLevelProgress(xp) {
    const lv = getLevel(xp);
    const cur  = LEVEL_XP[lv - 1] || 0;
    const next = LEVEL_XP[lv]     || LEVEL_XP[LEVEL_XP.length - 1] + 10000;
    const prog = xp - cur;
    const total = next - cur;
    return { prog, total, pct: Math.min(100, (prog / total) * 100), lv };
  }

  function getStage(lv) {
    if (lv >= 30) return 4;
    if (lv >= 15) return 3;
    if (lv >= 5)  return 2;
    return 1;
  }

  /* =============================================
     TIMER LOGIC
  ============================================= */
  function getElapsed(id) {
    const t = state.timers[id];
    if (!t.running || !t.startTs) return t.elapsed;
    return t.elapsed + Math.floor((Date.now() - t.startTs) / 1000);
  }

  function toggleTimer(id) {
    const t = state.timers[id];
    if (t.completed) return;

    if (t.running) {
      t.elapsed = getElapsed(id);
      t.running  = false;
      t.startTs  = null;
      clearInterval(intervals[id]);
      delete intervals[id];
    } else {
      t.running = true;
      t.startTs = Date.now();
      intervals[id] = setInterval(() => renderQuestCard(id), 1000);
    }

    save();
    renderQuestCard(id);
  }

  function completeQuest(id) {
    const t = state.timers[id];
    if (t.completed) return;

    t.elapsed = getElapsed(id);
    t.running  = false;
    t.startTs  = null;
    clearInterval(intervals[id]);
    delete intervals[id];
    t.completed = true;

    const log = todayLog();
    log[id] = true;
    log.any  = true;
    log[`${id}Time`] = t.elapsed;

    // XP
    const prevLv = getLevel(state.totalXP);
    const xpEarned = QUESTS[id].xp;
    state.totalXP += xpEarned;
    log.xp = (log.xp || 0) + xpEarned;

    // All-quests bonus
    if (log.corps && log.esprit && log.focus && !log.bonusAwarded) {
      state.totalXP += BONUS_ALL_XP;
      log.xp += BONUS_ALL_XP;
      log.bonusAwarded = true;
      setTimeout(() => toast(`BONUS +${BONUS_ALL_XP} XP — Triple quête !`), 1400);
    }

    // Streak / days (only on first completion of the day)
    if (!log.firstCompleted) {
      log.firstCompleted = true;
      state.totalDays++;
      state.streak++;
    }

    save();

    const newLv = getLevel(state.totalXP);
    if (newLv > prevLv) setTimeout(() => showLevelUp(newLv, prevLv), 900);

    toast(`+${xpEarned} XP — ${QUESTS[id].name} accomplie !`);
    renderAll();
  }

  /* =============================================
     RENDER FUNCTIONS
  ============================================= */
  function renderQuestCard(id) {
    const q = QUESTS[id];
    const t = state.timers[id];
    const elapsed = getElapsed(id);
    const pct = Math.min(100, (elapsed / q.minTime) * 100);
    const reached = elapsed >= q.minTime;

    // Mini bar
    const fill = document.getElementById(`fill-${id}`);
    if (fill) fill.style.width = `${pct}%`;

    // Card class
    const card = document.getElementById(`quest-${id}`);
    if (card) {
      card.classList.toggle('completed', t.completed);
      card.classList.toggle('timer-running', t.running && !t.completed);
    }

    // Action area
    const area = document.getElementById(`action-${id}`);
    if (!area) return;

    if (t.completed) {
      area.innerHTML = `
        <div class="badge-done">
          <span class="check">✦</span>
          <span>${fmt(t.elapsed)}</span>
        </div>`;
    } else if (reached && t.running) {
      area.innerHTML = `
        <button class="btn-complete" onclick="completeQuest('${id}')">TERMINER</button>`;
    } else {
      const icon = t.running ? '⏸' : '▶';
      area.innerHTML = `
        <button class="btn-timer ${t.running ? 'running' : ''}" onclick="toggleTimer('${id}')">
          <span class="t-icon">${icon}</span>
          <span class="t-time">${fmt(elapsed)}</span>
        </button>`;
    }
  }

  function renderHero() {
    const { pct, prog, total, lv } = getLevelProgress(state.totalXP);
    const stage = getStage(lv);
    const prevStage = getStage(lv - 1);

    const lvEl = document.getElementById('char-level');
    if (lvEl) lvEl.textContent = lv;

    const stEl = document.getElementById('char-stage');
    if (stEl) stEl.textContent = STAGE_LABELS[stage - 1];

    const bar = document.getElementById('xp-bar');
    if (bar) bar.style.width = `${pct}%`;

    const lbl = document.getElementById('xp-label');
    if (lbl) lbl.textContent = `${prog} / ${total} XP`;

    // Avatar stage
    const av = document.getElementById('avatar-container');
    if (av) {
      av.classList.remove('stage-1','stage-2','stage-3','stage-4');
      av.classList.add(`stage-${stage}`);
    }
  }

  function renderStats() {
    const el = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    el('stat-streak', state.streak);
    el('stat-days',   state.totalDays);
    el('stat-xp',     state.totalXP);
  }

  function renderDate() {
    const el = document.getElementById('day-text');
    if (!el) return;
    const opts = { weekday: 'long', day: 'numeric', month: 'long' };
    el.textContent = new Date().toLocaleDateString('fr-FR', opts).toUpperCase();
  }

  function renderAll() {
    renderHero();
    renderStats();
    Object.keys(QUESTS).forEach(id => renderQuestCard(id));
  }

  /* =============================================
     LEVEL-UP
  ============================================= */
  function showLevelUp(newLv, prevLv) {
    const stage    = getStage(newLv);
    const prevStage= getStage(prevLv);
    const stageChanged = stage !== prevStage;

    document.getElementById('lu-number').textContent = newLv;
    document.getElementById('lu-stage').textContent  = stageChanged ? STAGE_LABELS[stage - 1] : '';

    const ov = document.getElementById('lu-overlay');
    ov.classList.remove('show');
    void ov.offsetWidth; // reflow
    ov.classList.add('show');
    ov.style.pointerEvents = 'all';

    setTimeout(() => {
      ov.classList.remove('show');
      ov.style.pointerEvents = 'none';
    }, 3900);
  }

  /* =============================================
     WEEKLY RECAP
  ============================================= */
  function openRecap() {
    buildRecap();
    document.getElementById('recap-modal').classList.add('open');
  }

  function closeRecap() {
    document.getElementById('recap-modal').classList.remove('open');
  }

  function buildRecap() {
    const today = getToday();
    const dow = new Date().getDay(); // 0=Sun
    const mondayOff = dow === 0 ? -6 : 1 - dow;

    const LABELS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
    const days = Array.from({length:7}, (_,i) => shiftDate(mondayOff + i));

    let wXP = 0, wQ = 0, wCorps = 0, wEsprit = 0, wFocus = 0;

    const squares = days.map((d, i) => {
      const log = state.log[d] || {};
      const done = (log.corps ? 1 : 0) + (log.esprit ? 1 : 0) + (log.focus ? 1 : 0);
      wXP    += log.xp || 0;
      wQ     += done;
      wCorps += log.corpsTime  || 0;
      wEsprit+= log.espritTime || 0;
      wFocus += log.focusTime  || 0;

      const cls = d === today ? 'today' : d > today ? 'future' : done > 0 ? 'active' : '';
      return `
        <div class="day-sq ${cls}">
          <span class="day-lbl">${LABELS[i]}</span>
          <div class="day-dots">
            <span class="d-dot ${log.corps  ? 'corps-done'  : ''}"></span>
            <span class="d-dot ${log.esprit ? 'esprit-done' : ''}"></span>
            <span class="d-dot ${log.focus  ? 'focus-done'  : ''}"></span>
          </div>
        </div>`;
    }).join('');

    const msgs = [
      'La discipline construit la légende.',
      'Chaque session compte.',
      'Le corps et l\'esprit, forgés ensemble.',
      'La régularité bat l\'intensité.',
      'Tu construis quelque chose de réel.'
    ];
    const msg = msgs[Math.floor(Math.random() * msgs.length)];

    document.getElementById('recap-body').innerHTML = `
      <div class="week-grid">${squares}</div>
      <div class="recap-stats">
        <div class="rs-card">
          <span class="rs-val">${wXP}</span>
          <span class="rs-lbl">⚡ XP gagnés</span>
        </div>
        <div class="rs-card">
          <span class="rs-val">${wQ}</span>
          <span class="rs-lbl">Quêtes</span>
        </div>
        <div class="rs-card">
          <span class="rs-val">${fmtDuration(wFocus)}</span>
          <span class="rs-lbl">🎯 Deep work</span>
        </div>
        <div class="rs-card">
          <span class="rs-val">${fmtDuration(wCorps)}</span>
          <span class="rs-lbl">⚔️ Sport</span>
        </div>
        <div class="rs-card">
          <span class="rs-val">${fmtDuration(wEsprit)}</span>
          <span class="rs-lbl">📖 Lecture</span>
        </div>
        <div class="rs-card">
          <span class="rs-val">${state.streak}</span>
          <span class="rs-lbl">🔥 Série</span>
        </div>
      </div>
      <div class="recap-msg">"${msg}"</div>`;
  }

  /* =============================================
     TOAST
  ============================================= */
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }

  /* =============================================
     BACKGROUND PARTICLES
  ============================================= */
  function spawnParticles() {
    const c = document.getElementById('particles');
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('div');
      p.className = 'pt';
      p.style.cssText = `
        left:${Math.random()*100}%;
        top:${20+Math.random()*75}%;
        width:${1+Math.random()*2.5}px;
        height:${1+Math.random()*2.5}px;
        --d:${5+Math.random()*8}s;
        --dl:-${Math.random()*10}s;
        opacity:${0.2+Math.random()*0.4};
      `;
      c.appendChild(p);
    }
  }

  /* =============================================
     INIT
  ============================================= */
  function init() {
    state = loadState();

    // Resume any running timers
    Object.keys(QUESTS).forEach(id => {
      if (state.timers[id].running) {
        intervals[id] = setInterval(() => renderQuestCard(id), 1000);
      }
    });

    spawnParticles();
    renderDate();
    renderAll();
  }

  // Close recap on background click
  document.getElementById('recap-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeRecap();
  });

  document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7">
  <title>Daily RPG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #f2f2f7;
      --card:   #ffffff;
      --text:   #1c1c1e;
      --sub:    #3c3c43;
      --muted:  #8e8e93;
      --sep:    #e5e5ea;
      --accent: #007aff;
      --corps:  #ff3b30;
      --esprit: #34c759;
      --focus:  #5856d6;
      --sh: 0 1px 4px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button { touch-action: manipulation; font-family: inherit; }

    .app {
      max-width: 430px;
      margin: 0 auto;
      padding: 0 16px 88px;
    }

    /* ── HERO AVATAR ─────────────── */
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 0 20px;
      gap: 6px;
    }

    .hero-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }

    .hero-lv {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .hero-stage {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.5s;
    }

    [data-stage="2"] .hero-stage { color: #007aff; }
    [data-stage="3"] .hero-stage { color: #ff9f0a; }
    [data-stage="4"] .hero-stage { color: #ff375f; }

    .avatar-svg {
      width: 160px;
      height: 186px;
      overflow: visible;
    }

    .av-stage {
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .av-stage.active { opacity: 1; }

    .xp-bar-wrap { width: 160px; }

    .xp-track {
      height: 4px;
      background: var(--sep);
      border-radius: 3px;
      overflow: hidden;
    }

    .xp-fill {
      height: 100%;
      width: 0%;
      background: var(--muted);
      border-radius: 3px;
      transition: width 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  background 0.6s ease;
    }

    [data-stage="2"] .xp-fill { background: #007aff; }
    [data-stage="3"] .xp-fill { background: #ff9f0a; }
    [data-stage="4"] .xp-fill { background: #ff375f; }

    .xp-sub {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      margin-top: 5px;
    }

    /* ── LABELS DE SECTION ───────── */
    .section-label {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 18px 0 8px;
    }

    /* ── DATE ─────────────────────── */
    .day-row { margin-bottom: 2px; }

    .day-text {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: capitalize;
    }

    /* ── QUESTS ───────────────────── */
    .quests {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quest-card {
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--sh);
      overflow: hidden;
      border: 1.5px solid transparent;
      transition: border-color 0.3s;
    }

    .quest-card[data-quest="corps"]  { --qc: var(--corps); }
    .quest-card[data-quest="esprit"] { --qc: var(--esprit); }
    .quest-card[data-quest="focus"]  { --qc: var(--focus); }

    .quest-card.completed { border-color: var(--qc); }

    .quest-inner {
      display: flex;
      align-items: center;
      padding: 16px 16px 12px;
      gap: 14px;
    }

    .q-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--qc);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .q-info { flex: 1; min-width: 0; }

    .q-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .q-sub {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .q-action { flex-shrink: 0; }

    .q-bar-row { padding: 0 16px 13px; }

    .q-track {
      height: 3px;
      background: var(--sep);
      border-radius: 2px;
      overflow: hidden;
    }

    .q-fill {
      height: 100%;
      width: 0%;
      background: var(--qc);
      border-radius: 2px;
      transition: width 1s linear;
    }

    /* ── BOUTONS ──────────────────── */
    .btn-timer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 15px;
      min-height: 44px;
      min-width: 88px;
      background: var(--bg);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--qc);
      justify-content: center;
    }

    .btn-timer.running {
      background: color-mix(in srgb, var(--qc) 10%, white);
    }

    .btn-complete {
      padding: 9px 16px;
      min-height: 44px;
      background: var(--qc);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      animation: pop 1.2s ease-in-out infinite;
    }

    @keyframes pop {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.05); }
    }

    .badge-done {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 9px 12px;
      min-height: 44px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--qc);
    }

    /* ── CHECK ────────────────────── */
    .btn-check {
      padding: 9px 16px;
      min-height: 44px;
      background: var(--bg);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: var(--qc);
      font-size: 0.88rem;
      font-weight: 600;
    }

    /* ── COUNTER ──────────────────── */
    .counter-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .counter-val {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--qc);
      min-width: 42px;
      text-align: right;
    }

    .btn-plus {
      width: 44px;
      height: 44px;
      background: var(--bg);
      border: none;
      border-radius: 12px;
      color: var(--qc);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── STATS ────────────────────── */
    .stats-row {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      margin-bottom: 12px;
    }

    .stat-card {
      flex: 1;
      background: var(--card);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      box-shadow: var(--sh);
    }

    .stat-val {
      display: block;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-lbl {
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── RECAP BUTTON ─────────────── */
    .btn-recap {
      width: 100%;
      padding: 16px;
      background: var(--card);
      border: none;
      border-radius: 16px;
      box-shadow: var(--sh);
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    /* ── RECAP MODAL ──────────────── */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-bg.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 430px;
      background: var(--bg);
      border-radius: 22px 22px 0 0;
      padding: 12px 20px 52px;
      max-height: 88vh;
      overflow-y: auto;
      animation: sheet-up 0.26s cubic-bezier(0.32, 0.72, 0, 1);
    }

    @keyframes sheet-up {
      from { transform: translateY(28px); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--sep);
      border-radius: 2px;
      margin: 0 auto 22px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 20px;
    }

    .week-grid {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .day-sq {
      flex: 1;
      background: var(--card);
      border-radius: 12px;
      padding: 9px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .day-sq.active { background: #edf4ff; }
    .day-sq.today  { background: #e0edff; box-shadow: 0 0 0 1.5px var(--accent); }
    .day-sq.future { opacity: 0.3; }

    .day-lbl {
      font-size: 0.55rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .day-dots {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: center;
    }

    .d-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sep);
    }

    .d-dot.done { background: var(--accent); }

    .recap-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .rs-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 13px;
    }

    .rs-val {
      display: block;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.03em;
      margin-bottom: 3px;
    }

    .rs-lbl {
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .recap-msg {
      margin-top: 20px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.55;
    }

    .btn-close {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      background: var(--card);
      border: none;
      border-radius: 14px;
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── LEVEL-UP ─────────────────── */
    #lu-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #lu-overlay.show {
      display: flex;
      animation: lu-bg 3.8s forwards;
    }

    @keyframes lu-bg {
      0%   { background: rgba(0,0,0,0); }
      18%  { background: rgba(0,0,0,0.72); }
      80%  { background: rgba(0,0,0,0.72); }
      100% { background: rgba(0,0,0,0); }
    }

    .lu-content {
      text-align: center;
      animation: lu-pop 3.8s forwards;
    }

    @keyframes lu-pop {
      0%   { opacity: 0; transform: scale(0.8); }
      18%  { opacity: 1; transform: scale(1.02); }
      25%  { transform: scale(1); }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .lu-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .lu-number {
      font-size: 6.5rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      letter-spacing: -0.06em;
      margin-bottom: 8px;
    }

    .lu-stage {
      font-size: 1rem;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.05em;
    }

    /* ── TOAST ────────────────────── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(72px);
      background: #1c1c1e;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 11px 20px;
      border-radius: 22px;
      white-space: nowrap;
      z-index: 300;
      box-shadow: 0 4px 18px rgba(0,0,0,0.22);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>

<script>
/* =============================================
   DONNÉES DE QUÊTES
============================================= */
const MAIN_QUEST = {
  id: 'grand_oeuvre',
  name: 'Le Grand Œuvre',
  desc: 'Travail profond · 45 min',
  cat: 'focus',
  type: 'timer',
  target: 45 * 60,
  xp: 80
};

const SIDE_POOL = [
  { id: 'biscottos',    name: 'La quête des biscottos', desc: 'Séance physique · 20 min',   cat: 'corps',  type: 'timer',   target: 20 * 60, xp: 50 },
  { id: 'bibliotheque', name: 'Mode bibliothèque',      desc: 'Lecture · 15 min',            cat: 'esprit', type: 'timer',   target: 15 * 60, xp: 40 },
  { id: 'couloir_nage', name: 'Le couloir de nage',     desc: 'Cardio · 25 min',             cat: 'corps',  type: 'timer',   target: 25 * 60, xp: 55 },
  { id: 'bain_cerveau', name: 'Bain de cerveau',        desc: 'Podcast ou cours · 20 min',   cat: 'esprit', type: 'timer',   target: 20 * 60, xp: 45 },
  { id: 'sans_ecran',   name: 'Sans écran avant café',  desc: 'Pas de tel au réveil',        cat: 'focus',  type: 'check',   target: 1,       xp: 20 },
  { id: 'hydratation',  name: 'Hydratation de guerre',  desc: '2 litres dans la journée',    cat: 'corps',  type: 'check',   target: 1,       xp: 15 },
  { id: 'carnet_sage',  name: 'Le carnet du sage',      desc: 'Écrire dans son journal',     cat: 'esprit', type: 'check',   target: 1,       xp: 25 },
  { id: 'page_page',    name: 'Page par page',          desc: '10 pages à lire',             cat: 'esprit', type: 'counter', target: 10,      xp: 35 },
  { id: 'centenaire',   name: 'Le centenaire',          desc: '100 pompes dans la journée',  cat: 'corps',  type: 'counter', target: 100,     xp: 60 },
  { id: 'cinq_gratit',  name: 'Les 5 gratitudes',       desc: 'Note 5 choses positives',     cat: 'esprit', type: 'counter', target: 5,       xp: 25 },
];

const STAGE_LABELS = ['Apprenti', 'Disciple', 'Maître', 'Légende'];
const BONUS_ALL_XP = 30;

const LEVEL_XP = [
  0, 150, 350, 600, 1000, 1500, 2100, 2800, 3600, 4600,
  5800, 7200, 8800, 10600, 12800, 15300, 18100, 21200, 24600, 28400,
  32500, 37000, 42000, 47500, 53500, 60000, 67500, 76000, 85000, 95000
];

/* =============================================
   HELPERS QUÊTES
============================================= */
function getQuest(id) {
  if (MAIN_QUEST.id === id) return MAIN_QUEST;
  return SIDE_POOL.find(q => q.id === id) || null;
}

function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = (seed % 2147483647) || 1;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 16807) % 2147483647;
    [a[i], a[s % (i + 1)]] = [a[s % (i + 1)], a[i]];
  }
  return a;
}

function getDailyQuests() {
  const seed = parseInt(getToday().replace(/-/g, ''), 10);
  return seededShuffle(SIDE_POOL, seed).slice(0, 3);
}

function getTodayQuestIds() {
  return [MAIN_QUEST.id, ...getDailyQuests().map(q => q.id)];
}

/* =============================================
   STATE
============================================= */
let state;
const intervals = {};

function getQuestState(id) {
  if (!state.quests) state.quests = {};
  if (!state.quests[id])
    state.quests[id] = { running: false, elapsed: 0, startTs: null, completed: false, count: 0 };
  return state.quests[id];
}

function loadState() {
  try {
    const raw = localStorage.getItem('rpg_v2');
    if (raw) {
      const s = JSON.parse(raw);
      const today = getToday();
      if (s.lastDate && s.lastDate !== today) {
        const yesterday = shiftDate(-1);
        const hadActivity = (s.log[yesterday] || {}).any;
        if (!hadActivity && s.streak > 0) s.streak = 0;
        s.quests = {};
      }
      s.lastDate = today;
      if (!s.quests) s.quests = {};
      return s;
    }
    // Migration depuis v1 : on récupère XP/streak
    const old = localStorage.getItem('rpg_v1');
    if (old) {
      const o = JSON.parse(old);
      return { totalXP: o.totalXP || 0, streak: o.streak || 0, totalDays: o.totalDays || 0,
               lastDate: getToday(), log: {}, quests: {} };
    }
  } catch (_) {}
  return { totalXP: 0, streak: 0, totalDays: 0, lastDate: getToday(), log: {}, quests: {} };
}

function save() { localStorage.setItem('rpg_v2', JSON.stringify(state)); }

/* =============================================
   DATE UTILS
============================================= */
function getToday() { return new Date().toISOString().split('T')[0]; }

function shiftDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

function todayLog() {
  const t = getToday();
  if (!state.log[t]) state.log[t] = {
    completed: {}, any: false, bonusAwarded: false,
    xp: 0, firstCompleted: false, times: {}
  };
  return state.log[t];
}

function fmt(secs) {
  const m = Math.floor(secs / 60), s = secs % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function fmtDuration(secs) {
  const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
  return h > 0 ? `${h}h${String(m).padStart(2,'0')}` : `${m} min`;
}

/* =============================================
   LEVEL / XP
============================================= */
function getLevel(xp) {
  for (let i = LEVEL_XP.length - 1; i >= 0; i--)
    if (xp >= LEVEL_XP[i]) return i + 1;
  return 1;
}

function getLevelProgress(xp) {
  const lv   = getLevel(xp);
  const cur  = LEVEL_XP[lv - 1] || 0;
  const next = LEVEL_XP[lv] || LEVEL_XP[LEVEL_XP.length - 1] + 10000;
  const prog = xp - cur, total = next - cur;
  return { prog, total, pct: Math.min(100, prog / total * 100), lv };
}

function getStage(lv) {
  if (lv >= 30) return 4;
  if (lv >= 15) return 3;
  if (lv >= 5)  return 2;
  return 1;
}

/* =============================================
   TIMER ENGINE
============================================= */
function getElapsed(id) {
  const qs = getQuestState(id);
  if (!qs.running || !qs.startTs) return qs.elapsed;
  return qs.elapsed + Math.floor((Date.now() - qs.startTs) / 1000);
}

function toggleTimer(id) {
  const qs = getQuestState(id);
  if (qs.completed) return;
  const quest = getQuest(id);
  if (!quest) return;
  if (qs.running) {
    qs.elapsed = getElapsed(id);
    qs.running = false; qs.startTs = null;
    clearInterval(intervals[id]); delete intervals[id];
  } else {
    qs.running = true; qs.startTs = Date.now();
    intervals[id] = setInterval(() => renderQuestCard(quest), 1000);
  }
  save();
  renderQuestCard(quest);
}

function incrementCounter(id) {
  const qs = getQuestState(id);
  if (qs.completed) return;
  const quest = getQuest(id);
  if (!quest) return;
  qs.count = (qs.count || 0) + 1;
  save();
  renderQuestCard(quest);
}

function completeQuest(id) {
  const quest = getQuest(id);
  const qs    = getQuestState(id);
  if (!quest || qs.completed) return;

  if (quest.type === 'timer') {
    qs.elapsed = getElapsed(id);
    qs.running = false; qs.startTs = null;
    clearInterval(intervals[id]); delete intervals[id];
  }
  qs.completed = true;

  const log = todayLog();
  log.completed[id] = true;
  log.any = true;
  if (quest.type === 'timer') log.times[id] = qs.elapsed;

  const prevLv = getLevel(state.totalXP);
  state.totalXP += quest.xp;
  log.xp = (log.xp || 0) + quest.xp;

  const allDone = getTodayQuestIds().every(qid => log.completed[qid]);
  if (allDone && !log.bonusAwarded) {
    state.totalXP += BONUS_ALL_XP;
    log.xp += BONUS_ALL_XP;
    log.bonusAwarded = true;
    setTimeout(() => toast(`Bonus +${BONUS_ALL_XP} XP — Journée parfaite !`), 1400);
  }

  if (!log.firstCompleted) {
    log.firstCompleted = true;
    state.totalDays++;
    state.streak++;
  }

  save();
  const newLv = getLevel(state.totalXP);
  if (newLv > prevLv) setTimeout(() => showLevelUp(newLv, prevLv), 900);
  toast(`+${quest.xp} XP — ${quest.name} !`);
  renderAll();
}

/* =============================================
   RENDER
============================================= */
function questCardHTML(quest, isMain) {
  return `<div class="quest-card${isMain ? ' main-quest' : ''}" data-quest="${quest.cat}" id="quest-${quest.id}">
    <div class="quest-inner">
      <div class="q-dot"></div>
      <div class="q-info">
        <div class="q-name">${quest.name}</div>
        <div class="q-sub">${quest.desc}</div>
      </div>
      <div class="q-action" id="action-${quest.id}"></div>
    </div>
    <div class="q-bar-row">
      <div class="q-track"><div class="q-fill" id="fill-${quest.id}"></div></div>
    </div>
  </div>`;
}

function renderQuestCard(quest) {
  const id = quest.id;
  const qs = getQuestState(id);
  let pct  = 0;
  let html = '';

  if (qs.completed) {
    let label = '✓';
    if (quest.type === 'timer')   label = `✓ ${fmt(qs.elapsed)}`;
    if (quest.type === 'counter') label = `✓ ${quest.target}/${quest.target}`;
    html = `<div class="badge-done">${label}</div>`;
    pct  = 100;
  } else if (quest.type === 'timer') {
    const elapsed = getElapsed(id);
    pct = Math.min(100, elapsed / quest.target * 100);
    if (elapsed >= quest.target) {
      html = `<button class="btn-complete" onclick="completeQuest('${id}')">Terminer</button>`;
    } else {
      const icon = qs.running ? '⏸' : '▶';
      html = `<button class="btn-timer${qs.running ? ' running' : ''}" onclick="toggleTimer('${id}')">${icon} ${fmt(elapsed)}</button>`;
    }
  } else if (quest.type === 'check') {
    html = `<button class="btn-check" onclick="completeQuest('${id}')">Cocher</button>`;
  } else if (quest.type === 'counter') {
    const count = qs.count || 0;
    pct = Math.min(100, count / quest.target * 100);
    if (count >= quest.target) {
      html = `<button class="btn-complete" onclick="completeQuest('${id}')">Terminer</button>`;
    } else {
      html = `<div class="counter-wrap">
        <span class="counter-val">${count}/${quest.target}</span>
        <button class="btn-plus" onclick="incrementCounter('${id}')">+1</button>
      </div>`;
    }
  }

  const card = document.getElementById(`quest-${id}`);
  if (card) card.classList.toggle('completed', qs.completed);

  const fill = document.getElementById(`fill-${id}`);
  if (fill) fill.style.width = `${pct}%`;

  const area = document.getElementById(`action-${id}`);
  if (area) area.innerHTML = html;
}

function renderMainQuest() {
  const wrap = document.getElementById('main-quest-wrap');
  if (!wrap) return;
  wrap.innerHTML = questCardHTML(MAIN_QUEST, true);
  renderQuestCard(MAIN_QUEST);
}

function renderSideQuests() {
  const wrap = document.getElementById('side-quests-wrap');
  if (!wrap) return;
  const quests = getDailyQuests();
  wrap.innerHTML = quests.map(q => questCardHTML(q)).join('');
  quests.forEach(q => renderQuestCard(q));
}

function renderHero() {
  const { pct, prog, total, lv } = getLevelProgress(state.totalXP);
  const stage = getStage(lv);

  const lvEl = document.getElementById('ring-level');
  if (lvEl) lvEl.textContent = lv;

  const stEl = document.getElementById('ring-stage');
  if (stEl) stEl.textContent = STAGE_LABELS[stage - 1];

  for (let s = 1; s <= 4; s++) {
    const g = document.getElementById(`av-s${s}`);
    if (g) g.classList.toggle('active', s === stage);
  }

  const fill = document.getElementById('xp-fill');
  if (fill) fill.style.width = `${pct}%`;

  const lbl = document.getElementById('xp-label');
  if (lbl) lbl.textContent = `${prog} / ${total} XP`;

  const section = document.getElementById('ring-section');
  if (section) section.dataset.stage = stage;
}

function renderStats() {
  const el = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  el('stat-streak', state.streak);
  el('stat-days',   state.totalDays);
  el('stat-xp',     state.totalXP);
}

function renderDate() {
  const el = document.getElementById('day-text');
  if (el) el.textContent = new Date().toLocaleDateString('fr-FR',
    { weekday: 'long', day: 'numeric', month: 'long' });
}

function renderAll() {
  renderHero();
  renderStats();
  renderMainQuest();
  renderSideQuests();
}

/* =============================================
   LEVEL-UP
============================================= */
function showLevelUp(newLv, prevLv) {
  const stage = getStage(newLv);
  const stageChanged = stage !== getStage(prevLv);
  document.getElementById('lu-number').textContent = newLv;
  document.getElementById('lu-stage').textContent  = stageChanged ? STAGE_LABELS[stage - 1] : '';
  const ov = document.getElementById('lu-overlay');
  ov.classList.remove('show'); void ov.offsetWidth;
  ov.classList.add('show'); ov.style.pointerEvents = 'all';
  setTimeout(() => { ov.classList.remove('show'); ov.style.pointerEvents = 'none'; }, 3900);
}

/* =============================================
   RECAP
============================================= */
function openRecap()  { buildRecap(); document.getElementById('recap-modal').classList.add('open'); }
function closeRecap() { document.getElementById('recap-modal').classList.remove('open'); }

function buildRecap() {
  const today     = getToday();
  const dow       = new Date().getDay();
  const mondayOff = dow === 0 ? -6 : 1 - dow;
  const LABELS    = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const days      = Array.from({length: 7}, (_, i) => shiftDate(mondayOff + i));

  let wXP = 0, wQ = 0, wTime = 0;

  const squares = days.map((d, i) => {
    const log   = state.log[d] || {};
    const done  = Object.values(log.completed || {}).filter(Boolean).length;
    wXP  += log.xp || 0;
    wQ   += done;
    wTime += Object.values(log.times || {}).reduce((a, b) => a + b, 0);

    const cls = d === today ? 'today' : d > today ? 'future' : done > 0 ? 'active' : '';
    let dots  = '';
    for (let k = 0; k < 4; k++)
      dots += `<span class="d-dot${k < done ? ' done' : ''}"></span>`;
    return `<div class="day-sq ${cls}">
      <span class="day-lbl">${LABELS[i]}</span>
      <div class="day-dots">${dots}</div></div>`;
  }).join('');

  const msgs = [
    'La régularité bat l\'intensité.',
    'Chaque session compte.',
    'Discipline = liberté.',
    'Tu construis quelque chose de réel.',
    'Le corps et l\'esprit, ensemble.'
  ];

  document.getElementById('recap-body').innerHTML = `
    <div class="week-grid">${squares}</div>
    <div class="recap-stats">
      <div class="rs-card"><span class="rs-val">${wXP}</span><span class="rs-lbl">⚡ XP</span></div>
      <div class="rs-card"><span class="rs-val">${wQ}</span><span class="rs-lbl">Quêtes</span></div>
      <div class="rs-card"><span class="rs-val">${fmtDuration(wTime)}</span><span class="rs-lbl">Temps actif</span></div>
      <div class="rs-card"><span class="rs-val">${state.streak}</span><span class="rs-lbl">🔥 Série</span></div>
    </div>
    <div class="recap-msg">${msgs[Math.floor(Math.random() * msgs.length)]}</div>`;
}

/* =============================================
   TOAST
============================================= */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* =============================================
   INIT
============================================= */
function init() {
  state = loadState();
  const todayQuests = [MAIN_QUEST, ...getDailyQuests()];
  todayQuests.forEach(q => {
    const qs = getQuestState(q.id);
    if (q.type === 'timer' && qs.running)
      intervals[q.id] = setInterval(() => renderQuestCard(q), 1000);
  });
  renderDate();
  renderAll();
}

document.getElementById('recap-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeRecap();
});

document.addEventListener('DOMContentLoaded', init);
</script>
